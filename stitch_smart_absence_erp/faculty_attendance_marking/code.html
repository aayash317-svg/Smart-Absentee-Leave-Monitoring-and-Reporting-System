<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('student-list-content');
            
            students.forEach((student, index) => {
                const row = document.createElement('div');
                row.className = "bg-surface-container-lowest border border-outline-variant rounded-2xl p-4 flex flex-col md:flex-row items-center gap-4 transition-all hover:shadow-md hover:border-primary/30";
                
                row.innerHTML = `
                    <div class="flex items-center flex-1 w-full gap-4">
                        <div class="w-14 h-14 rounded-full overflow-hidden bg-surface-container-high shrink-0 ring-2 ring-background shadow-sm">
                            <img src="placeholder" data-alt="${studentImages[index]}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex flex-col min-w-0">
                            <h3 class="font-section-title text-on-surface truncate">${student.name}</h3>
                            <span class="text-label font-label text-outline uppercase tracking-tight">${student.id}</span>
                        </div>
                    </div>
                    
                    <div class="w-full md:w-auto">
                        <div class="flex items-center bg-surface-container-high p-1 rounded-xl w-full md:w-80">
                            <label class="flex-1 text-center cursor-pointer">
                                <input type="radio" name="attendance-${index}" value="present" class="hidden peer" checked>
                                <div class="py-2 rounded-lg text-small font-semibold transition-all peer-checked:bg-secondary peer-checked:text-white text-on-surface-variant hover:bg-surface-container-highest">Present</div>
                            </label>
                            <label class="flex-1 text-center cursor-pointer">
                                <input type="radio" name="attendance-${index}" value="absent" class="hidden peer">
                                <div class="py-2 rounded-lg text-small font-semibold transition-all peer-checked:bg-error peer-checked:text-white text-on-surface-variant hover:bg-surface-container-highest">Absent</div>
                            </label>
                            <label class="flex-1 text-center cursor-pointer">
                                <input type="radio" name="attendance-${index}" value="late" class="hidden peer">
                                <div class="py-2 rounded-lg text-small font-semibold transition-all peer-checked:bg-tertiary-container peer-checked:text-white text-on-surface-variant hover:bg-surface-container-highest">Late</div>
                            </label>
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });

            // Summary calculation logic
            const updateSummary = () => {
                const radios = document.querySelectorAll('input[type="radio"]:checked');
                let p = 0, a = 0, l = 0;
                radios.forEach(r => {
                    if(r.value === 'present') p++;
                    else if(r.value === 'absent') a++;
                    else if(r.value === 'late') l++;
                });
                document.getElementById('presentCount').innerText = p;
                document.getElementById('absentCount').innerText = a;
                document.getElementById('lateCount').innerText = l;
            };

            container.addEventListener('change', updateSummary);
            updateSummary();

            document.getElementById('markAllBtn').addEventListener('click', () => {
                document.querySelectorAll('input[value="present"]').forEach(r => r.checked = true);
                updateSummary();
            });
        });
    </script>
