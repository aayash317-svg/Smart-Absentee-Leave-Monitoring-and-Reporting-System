<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-between overflow-x-hidden">
<!-- TopAppBar Fragment (Transactional: No Navigation Items) -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-background h-14 flex items-center px-margin-mobile md:px-margin-desktop max-w-7xl mx-auto">
<div class="flex items-center gap-sm">

<h1 class="font-h1-mobile text-h1-mobile md:font-h1 md:text-h1 text-primary">Attendance Hub</h1>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col items-center justify-center w-full px-margin-mobile relative">
<!-- Subtle Ambient Background Element -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-primary rounded-full blur-[120px] opacity-10"></div>
</div>
<!-- Success Content Card -->
<div class="w-full max-w-md z-10 flex flex-col items-center text-center">
<!-- Large Icon Cluster -->
<div class="relative mb-lg">
<div class="w-24 h-24 bg-primary-container rounded-full flex items-center justify-center animate-pulse-slow">
<span class="material-symbols-outlined text-[48px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">mark_email_unread</span>
</div>
<!-- Decorative Orbitals -->
<div class="absolute -top-2 -right-2 w-6 h-6 bg-secondary rounded-full border-4 border-surface"></div>
<div class="absolute -bottom-1 -left-4 w-4 h-4 bg-tertiary rounded-full border-2 border-surface"></div>
</div>
<!-- Headline -->
<h2 class="font-h1 text-h1 text-on-surface mb-md">Check your email</h2>
<!-- Body Text -->
<p class="font-body text-body text-on-surface-variant max-w-[320px] mb-xxl">
                We've sent password reset instructions to your university email address.
            </p>
<!-- Action Cluster -->
<div class="w-full space-y-md">
<!-- Primary Action -->
<button class="w-full h-14 bg-primary text-on-primary font-section-title text-section-title rounded-xl shadow-lg hover:shadow-xl hover:bg-primary/90 transition-all active:scale-[0.98] duration-200 flex items-center justify-center gap-sm">
                    Open Email App
                    <span class="material-symbols-outlined">open_in_new</span>
</button>
<!-- Secondary Action -->
<button class="w-full h-14 bg-surface border border-outline-variant text-primary font-section-title text-section-title rounded-xl hover:bg-surface-container-low transition-all active:scale-[0.98] duration-200">
                    Resend Email
                </button>
</div>
<!-- Tertiary Link -->
<button class="mt-xl text-primary font-label text-label uppercase tracking-widest hover:underline active:opacity-70 transition-all">
                Back to Login
            </button>
</div>
<!-- Decorative Precision Element (Right Side) -->
<div class="hidden lg:block absolute right-xxl top-1/2 -translate-y-1/2 w-72 h-72 border border-outline-variant rounded-full opacity-20">

<div class="w-48 h-48 border border-outline-variant rounded-full border-dashed animate-spin-[20s]"></div>
</div>

<span class="text-[10px] font-mono text-outline uppercase">Monitoring Active</span>
</div>
</div>

<!-- Micro-interaction Scripts -->
<script>
// Static confirmation screen — no API call needed
        const resendBtn = document.querySelector('button');
        if (resendBtn) {
            resendBtn.addEventListener('click', async () => {
                const orig = resendBtn.innerHTML;
                setLoading(resendBtn, true, orig);
                showToast('Reset email re-sent!', 'success');
                setTimeout(() => setLoading(resendBtn, false, orig), 2000);
            });
        }
    </script>
