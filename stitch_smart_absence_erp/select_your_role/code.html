<body class="bg-mesh min-h-screen flex flex-col font-body text-on-surface">
<!-- TopAppBar -->
<header class="bg-background w-full top-0 z-40 transition-opacity duration-200 flex items-center justify-between px-margin-mobile md:px-margin-desktop w-full h-14">
<div class="flex items-center gap-4">
<button class="hover:bg-surface-container-high p-2 rounded-full transition-colors">

</button>
<h1 class="font-h3 text-h3-mobile font-bold text-primary">Precision Monitor</h1>
</div>
<div class="hidden md:flex items-center gap-6">
<span class="text-outline font-small text-small">Step 1 of 3</span>
</div>

<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl">
<div class="max-w-4xl w-full">
<div class="text-center mb-xl">
<h2 class="font-h1-mobile md:font-h1 text-h1-mobile md:text-h1 mb-md">Tell us who you are</h2>
<p class="text-on-surface-variant font-body text-body max-w-xl mx-auto">

</div>
<!-- Bento Role Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
<!-- Student Role -->
<button class="role-card group relative bg-white border border-outline-variant p-lg rounded-xl text-left flex flex-col h-full hover:border-primary-container cursor-pointer" onclick="selectRole(this)">
<div class="mb-xl bg-primary-container/10 w-12 h-12 rounded-lg flex items-center justify-center text-primary-container transition-colors group-hover:bg-primary-container group-hover:text-white">

                    </p>
<div class="check-badge absolute top-4 right-4 opacity-0 scale-50 transition-all duration-300">
<span class="material-symbols-outlined text-primary font-bold">check_circle</span>
</div>
</button>
<!-- Faculty/Staff Role -->
<button class="role-card group relative bg-white border border-outline-variant p-lg rounded-xl text-left flex flex-col h-full hover:border-primary-container cursor-pointer" onclick="selectRole(this)">
<div class="mb-xl bg-secondary-container/20 w-12 h-12 rounded-lg flex items-center justify-center text-secondary transition-colors group-hover:bg-secondary group-hover:text-white">
<span class="material-symbols-outlined text-3xl">badge</span>
</div>
<h3 class="font-h3 text-h3-mobile mb-sm">Faculty/Staff</h3>
<p class="text-on-surface-variant font-body text-small flex-grow">

                    </p>
<div class="check-badge absolute top-4 right-4 opacity-0 scale-50 transition-all duration-300">
<span class="material-symbols-outlined text-primary font-bold">check_circle</span>
</div>
</button>
<!-- Administrator Role -->
<button class="role-card group relative bg-white border border-outline-variant p-lg rounded-xl text-left flex flex-col h-full hover:border-primary-container cursor-pointer" onclick="selectRole(this)">

<script>
        function selectRole(element) {
            // Remove selection from all other cards
            document.querySelectorAll('.role-card').forEach(card => {
                card.classList.remove('selected');
                // Reset icon styles
                const iconContainer = card.querySelector('div');
                iconContainer.classList.add('transition-colors');
            });

            // Add selection to clicked card
            element.classList.add('selected');

            // Enable the continue button
            const btn = document.getElementById('continueBtn');
            btn.disabled = false;
            btn.classList.remove('bg-outline', 'text-white/50', 'cursor-not-allowed');
            btn.classList.add('bg-primary-container', 'text-white', 'hover:shadow-lg', 'active:scale-95');
            
            // Interaction Feedback
            createRipple(element);
        }

        function createRipple(element) {
            const circle = document.createElement("span");
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `0px`;
            circle.style.top = `0px`;
            circle.classList.add("ripple");

            const ripple = element.getElementsByClassName("ripple")[0];
            if (ripple) {
                ripple.remove();
            }
            element.appendChild(circle);
        }
    </script>
<style>
        /* Lightweight micro-interaction style */
        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple 600ms linear;
            background-color: rgba(37, 99, 235, 0.1);
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Responsive spacing adjustments */
        @media (max-width: 768px) {
            .role-card {
                padding: 16px;
            }
            .role-card .mb-xl {
                margin-bottom: 16px;
            }
        }
    </style>
<script>
// Wire role buttons to the login page with role pre-fill
        document.querySelectorAll('[data-role], button, a').forEach(el => {
            const role = el.dataset?.role || el.textContent?.trim();
            if (['Student','Coordinator','HOD','Dean','Faculty','Admin'].includes(role)) {
                el.style.cursor = 'pointer';
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    sessionStorage.setItem('selected_role', role);
                    window.location.href = '/erp/login_attendance_hub/code.html';
                });
            }
        });
    </script>
