<main class="w-full max-w-[440px] z-10">

<button class="group w-full flex items-center justify-center gap-md py-3 px-4 bg-primary text-on-primary font-section-title text-section-title rounded-xl transition-all duration-200 hover:opacity-90 active:scale-[0.98] shadow-sm">

</div>

<!-- Manual Login Form -->
<form class="space-y-lg">
<div>

</div>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label text-label text-on-surface-variant uppercase tracking-wider" for="password">Password</label>

</div>
<div class="relative">

<input class="w-full pl-12 pr-4 py-3 bg-[#F8FAFC] border border-outline-variant rounded-xl font-body text-on-surface focused-input transition-all duration-150" id="password" placeholder="••••••••" type="password"/>

</div>
</div>

<!-- Visual Polish: Subtle Particle Layer -->
<canvas class="fixed inset-0 -z-5 pointer-events-none opacity-30" id="particles"></canvas>
<script>
        // Simple micro-interaction for the particle background to enhance "Modern SaaS Minimalist" feel
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
                this.opacity = Math.random() * 0.5;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width) this.x = 0;
                if (this.x < 0) this.x = canvas.width;
                if (this.y > canvas.height) this.y = 0;
                if (this.y < 0) this.y = canvas.height;
            }

            draw() {
                ctx.fillStyle = `rgba(37, 99, 235, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resize);
        resize();
        init();
        animate();

        // Input Focus Effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined')?.classList.remove('text-primary');
            });
        });
    </script>
