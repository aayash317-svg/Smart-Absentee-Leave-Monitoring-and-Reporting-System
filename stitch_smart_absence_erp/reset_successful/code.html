<body class="flex flex-col min-h-screen">
<!-- TopAppBar Fragment (Transactional/Auth - Suppressed Nav Items) -->
<header class="w-full top-0 sticky bg-surface flex items-center px-margin-mobile h-14 max-w-md mx-auto z-50">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
<h1 class="font-h2 text-h2 font-bold text-primary">Attendance Hub</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-md relative overflow-hidden">
<!-- Background Animation Layer -->
<canvas class="confetti-canvas" id="confetti"></canvas>
<!-- Centered Success Layout -->
<div class="w-full max-w-md z-10">
<div class="glass-card rounded-xl p-lg text-center shadow-sm">
<!-- Success Icon Cluster -->
<div class="mb-xl relative inline-block">
<!-- Ripple effect circles -->
<div class="absolute inset-0 bg-secondary-container opacity-20 rounded-full animate-ping scale-150"></div>
<div class="relative w-24 h-24 bg-secondary-container rounded-full flex items-center justify-center mx-auto">
<span class="material-symbols-outlined text-secondary text-[56px]" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Text Content -->
<div class="space-y-md mb-xl">
<h2 class="font-h1-mobile text-h1-mobile text-on-background">Password Reset Successful</h2>
<p class="font-body text-body text-on-surface-variant max-w-[280px] mx-auto">
                        Your password has been updated. You can now sign in with your new credentials.
                    </p>
</div>
<!-- Actions -->
<div class="space-y-sm">
<button class="w-full py-4 bg-primary text-on-primary font-h3 text-h3 rounded-lg shadow-md active:scale-95 transition-all duration-200">
                        Sign In to Hub
                    </button>
</div>
<!-- Contextual Detail (Precision Monitor Aesthetic) -->
<div class="mt-xl pt-lg border-t border-outline-variant flex justify-between items-center px-4">
<div class="text-left">
<p class="font-label text-label text-outline uppercase tracking-wider">Session Security</p>
<p class="font-small text-small text-on-surface">Verified Identity</p>
</div>
<div class="text-right">
<p class="font-label text-label text-outline uppercase tracking-wider">Timestamp</p>
<p class="font-small text-small text-on-surface" id="timestamp">--:--</p>
</div>
</div>
</div>
<!-- Supporting Footer for Auth Pages -->
<div class="mt-lg text-center">
<p class="font-small text-small text-on-surface-variant">
                    Having trouble? <a class="text-primary font-semibold hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
</main>
<!-- Bottom Navigation Suppressed for Login/Success Screens -->
<script>
// After 3 seconds auto-redirect to login
        setTimeout(() => {
            window.location.href = '/erp/login_attendance_hub/code.html';
        }, 3500);
        document.querySelectorAll('button, a').forEach(el => {
            if (/login|sign.?in|back/i.test(el.textContent)) {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = '/erp/login_attendance_hub/code.html';
                });
            }
        });
    </script>
