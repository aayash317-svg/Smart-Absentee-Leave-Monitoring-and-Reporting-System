<body class="flex flex-col min-h-screen items-center justify-center overflow-hidden">
<!-- Confetti layer -->
<canvas class="confetti-canvas" id="confetti"></canvas>
<!-- Top App Bar (Simplified for Onboarding) -->
<header class="fixed top-0 w-full bg-background flex items-center justify-center h-14 px-margin-mobile z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="school">school</span>
<span class="font-h3 text-h3-mobile font-bold text-primary tracking-tight">Precision Monitor</span>
</div>
</header>
<main class="relative w-full max-w-lg px-margin-mobile flex flex-col items-center text-center animate-in fade-in slide-in-from-bottom-4 duration-1000">
<!-- Success Illustration Section -->
<div class="relative w-full aspect-square max-w-[320px] mb-lg flex items-center justify-center">
<!-- Background Halo -->
<div class="absolute inset-0 bg-primary/5 rounded-full scale-110 animate-pulse"></div>
<div class="absolute inset-4 bg-primary/10 rounded-full scale-100"></div>
<!-- Main Success Visual -->
<div class="relative z-20 flex flex-col items-center">
<div class="w-32 h-32 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/20 mb-md transform hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-white text-6xl" style="font-variation-settings: 'wght' 600;">check_circle</span>
</div>
<!-- Stylized data-alt image for the background atmosphere -->
<div class="absolute -z-10 opacity-40 blur-2xl">
<div class="w-64 h-64 rounded-full bg-cover" data-alt="A clean and professional digital workspace abstract illustration. A sleek 3D render of a glass-morphic dashboard with vibrant blue and white glowing data points floating in a bright, airy office environment. The style is minimalist SaaS with soft ambient shadows and high-key lighting, emphasizing organizational success and clarity." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC9iwnDEOon_PnhB-JCzjz-KABIy4N8H5qtYoecYGOZByePAj_t7c7Tx6Vcz239df-2gWVGaJyshzgDDlQCS6kPxrMKZ4p_skE_i_Rbeq1qKkL3vls0MfAvlpM30sUaHYnG66i9CXCrvNQ1OuB262q8DJNKv66FUdksa2ip_lMx2A-CbO_IO9ygUCq_jWYDmxVfYN4SbYm49Fmfl1IaxnRG1xu3pTSlEtMGgPezshaG-Sa6J66NLbYyxi2ablMHA66yOwu4WaTkaug')"></div>
</div>
</div>
</div>
<!-- Content -->
<h1 class="font-h1-mobile text-h1-mobile md:font-h1 md:text-h1 text-on-background mb-sm">
            You're all set!
        </h1>
<p class="font-body text-body text-on-surface-variant max-w-sm mb-xxl">
            Welcome to the Attendance Hub. Your dashboard is ready for you. Start managing your team's availability with precision.
        </p>
<!-- Action Button -->
<div class="w-full space-y-md">
<a class="inline-flex w-full items-center justify-center gap-2 bg-primary-container text-on-primary-container font-body text-body py-4 px-xl rounded-xl hover:opacity-90 active:scale-[0.98] transition-all shadow-sm" href="#">
<span>Go to Dashboard</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</a>
<a class="inline-flex w-full items-center justify-center gap-2 bg-surface text-primary border border-outline-variant font-body text-body py-4 px-xl rounded-xl hover:bg-surface-container-low transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
<span>Need help?</span>
</a>
</div>
<!-- Decorative Progress Indicator (Static) -->
<div class="flex gap-2 mt-xxl">
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-2 h-2 rounded-full bg-outline-variant"></div>
<div class="w-8 h-2 rounded-full bg-primary"></div>
</div>
</main>
<!-- Footer Help Link -->
<footer class="fixed bottom-8 w-full text-center px-margin-mobile">
<p class="font-label text-label text-outline uppercase tracking-widest">
            Ready to monitor with precision
        </p>
</footer>
<script>
// Guard: if already logged in, redirect to dashboard
        const user = getUser();
        if (user) { redirectByRole(); }
        // Wire CTA button
        document.querySelectorAll('button, a').forEach(el => {
            if (/start|login|sign.?in/i.test(el.textContent)) {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.href = '/erp/login_attendance_hub/code.html';
                });
            }
        });
    </script>
